        css - cascading style sheet 
            flowing - a document that contains styles
        css is styling language that is used to describe the presentation of the webpage
        it deals with colors,backgrounds,fonts,transitions,animations and responsiveness
        
        how to insert css
        1) inline css
           styles are emebed within the tag using style attribute
           <h1 style='color:red;background:blue;'>heading 1</h1>
        
        2) internal css
          styles are embeded in the document head section using style tag
          
          selector
          it is used to target the html elements for applying styles
        
            selector{
            propertyname:value;
            propertyname:value;
            declration
            }
            
        <style>
            h2{

            }

        3) external css
        styles are embeded in another file which has a .css extension
        can be linked using link tag
        demo.css
        h3{
        color:orange;
        }
        
        <link rel='stylesheet' href='demo.css'>

        1) inline css having high priority
