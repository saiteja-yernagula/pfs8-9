<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      header{
        background:#020235;
        padding:30px;
        text-align: center;
        position: sticky;
        top:0;
      }
      header button{
        background:blue;
        color:white;
        border:none;
        border-radius:10px;
        padding:20px;
        margin:10px;
        transition: all 0.5s;
      }
      header button:hover{
        transform: translate(0px,-6px);
      }
      .s1{
        height:500px;
        background:linear-gradient(rgba(0, 0, 0,0.6),rgb(0, 0, 0,0.6)),
            url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmtc6C5aeXBIWDtMME4zQOrPeisssPSN1aGhVrv-ES3Q&s=10');
        background-repeat: no-repeat;
        background-size: 100% 100%;
        color:white;
        text-align: center;
        padding-top:130px;
      }
    </style>
</head>
<body>
    <header>
        <nav>
            <button>Home</button>
            <button>About</button>
            <button>Services</button>
            <button>Contact</button>
        </nav>
    </header>

    <section class="s1">
        <h1>Learn CSS Through Projects</h1>
        <p>This project demonstrates CSS Colors, Backgrounds, Flexbox, Box Model, Typography, Shadows, and Responsive Design in one modern webpage.</p>
    </section>


</body>
</html>
